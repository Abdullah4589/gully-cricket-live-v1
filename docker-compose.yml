services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gully
      POSTGRES_PASSWORD: gully
      POSTGRES_DB: gully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gully -d gully"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://gully:gully@db:5432/gully
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
